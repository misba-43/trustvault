<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrustVault - Login</title>


    <style>

        :root {

            --navy: #17263a;
            --navy-dark: #0e1a2a;
            --navy-soft: #34465b;

            --ivory: #f7f4ea;
            --ivory-light: #fcfaf3;

            --gold: #c8a45d;
            --gold-light: #e4cf9c;

            --text: #1a293b;
            --text-soft: #667384;

        }


        * {

            box-sizing: border-box;

        }


        body {

            margin: 0;
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--ivory);
            color: var(--text);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 30px;

        }


        .login-container {

            width: 100%;
            max-width: 430px;

        }


        .logo {

            text-align: center;
            margin-bottom: 28px;

        }


        .logo-icon {

            width: 58px;
            height: 58px;

            margin: auto;

            background: var(--navy);
            color: var(--gold-light);

            border-radius: 16px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 27px;
            font-weight: bold;

        }


        .brand {

            margin-top: 12px;

            font-size: 30px;
            font-weight: 800;

            color: var(--navy);

        }


        .tagline {

            margin-top: 5px;

            font-size: 14px;

            color: var(--text-soft);

        }


        .card {

            background:
                var(--ivory-light);

            border:
                1px solid
                rgba(23, 38, 58, 0.10);

            border-radius: 22px;

            padding: 34px;

            box-shadow:
                0 15px 40px
                rgba(23, 38, 58, 0.10);

        }


        .welcome {

            font-size: 27px;

            font-weight: 750;

            color: var(--navy);

            margin-bottom: 8px;

        }


        .description {

            font-size: 14px;

            color: var(--text-soft);

            margin-bottom: 28px;

            line-height: 1.5;

        }


        label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 7px;

            color: var(--navy);

        }


        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border:
                1px solid
                rgba(23, 38, 58, 0.18);

            border-radius: 10px;

            background: white;

            color: var(--text);

            font-size: 14px;

            outline: none;

        }


        input:focus {

            border-color:
                var(--gold);

            box-shadow:
                0 0 0 3px
                rgba(200, 164, 93, 0.15);

        }


        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                var(--navy);

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

        }


        .login-btn:hover {

            background:
                var(--navy-dark);

        }


        .or {

            text-align: center;

            margin: 22px 0;

            color: var(--text-soft);

            font-size: 13px;

        }


        .signup-text {

            text-align: center;

            font-size: 14px;

            color: var(--text-soft);

        }


        .signup-text a {

            color: var(--gold);

            font-weight: 700;

            text-decoration: none;

        }


        .signup-text a:hover {

            color: var(--navy);

            text-decoration: underline;

        }


        .footer {

            text-align: center;

            margin-top: 22px;

            font-size: 12px;

            color: var(--text-soft);

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">

            <div class="logo-icon">
                ✓
            </div>


            <div class="brand">
                TrustVault
            </div>


            <div class="tagline">
                Your personal document space
            </div>

        </div>



        <div class="card">


            <div class="welcome">
                Welcome back
            </div>


            <div class="description">

                Access your important documents,
                organized safely in one place.

            </div>



            <form id="loginForm">


                <label for="email">
                    Email address
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >



                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >



                <button
                    class="login-btn"
                    type="submit">

                    Login

                </button>


            </form>



            <div class="or">
                or
            </div>



            <div class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create an account
                </a>

            </div>


        </div>



        <div class="footer">

            TrustVault • Your documents.
            Your space. Your trust.

        </div>


    </div>



    <script>


        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                login
            );



        async function login(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;

		alert("Login button is working");

            try {


                const response =
                    await fetch(
                        "/api/login",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email: email,

                                    password: password

                                })

                        }
                    );



                const data =
                    await response.json();



                if (!response.ok) {

                    alert(
                        data.message ||
                        "Login failed."
                    );

                    return;

                }



                localStorage.setItem(
                    "trustvaultUser",
                    JSON.stringify(
                        data.user
                    )
                );



                alert(
                    "Login successful!"
                );



                window.location.href =
                    "pages/dashboard.html";


            }


            catch (error) {

                console.error(error);


                alert(
                    "Unable to connect to TrustVault server. Make sure the backend is running."
                );

            }

        }

    </script>


</body>

</html>
