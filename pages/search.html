<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustVault - Search</title>

    <style>

        :root {
            --navy: #17263a;
            --navy-dark: #0e1a2a;
            --ivory: #f7f4ea;
            --ivory-light: #fcfaf3;
            --gold: #c8a45d;
            --gold-light: #e4cf9c;
            --text: #1a293b;
            --text-soft: #667384;
            --border: rgba(23, 38, 58, 0.12);
            --red: #a95b55;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--ivory);
            color: var(--text);
            min-height: 100vh;
        }


        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 240px;
            height: 100vh;

            background: var(--navy);

            padding: 28px 18px;

            color: white;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 11px;

            padding: 0 10px;
            margin-bottom: 42px;
        }


        .logo-icon {
            width: 40px;
            height: 40px;

            background: var(--gold);
            color: var(--navy-dark);

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
            font-weight: 800;
        }


        .logo-name {
            font-size: 23px;
            font-weight: 800;
        }


        .menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }


        .menu a {
            display: flex;
            align-items: center;
            gap: 13px;

            padding: 12px 14px;

            border-radius: 10px;

            color: #dce3eb;

            text-decoration: none;

            font-size: 13px;
        }


        .menu a:hover,
        .menu a.active {
            background: rgba(200, 164, 93, 0.18);
            color: var(--gold-light);
        }


        .menu-icon {
            width: 20px;
            text-align: center;
        }


        /* MAIN */

        .main {
            margin-left: 240px;

            min-height: 100vh;

            padding: 35px 45px;
        }


        .page-header {
            margin-bottom: 28px;
        }


        .page-header h1 {
            color: var(--navy);

            font-size: 31px;

            margin-bottom: 6px;
        }


        .page-header p {
            color: var(--text-soft);

            font-size: 13px;
        }


        /* SEARCH */

        .search-area {
            background: var(--ivory-light);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 22px;

            margin-bottom: 25px;
        }


        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .search-icon {
            font-size: 20px;
            color: var(--gold);
        }


        .search-box input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            font-size: 15px;

            color: var(--text);
        }


        /* VOICE SEARCH BUTTON */

        .voice-search-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;

            border-radius: 10px;

            background: rgba(200, 164, 93, 0.16);

            color: var(--gold);

            font-size: 18px;

            cursor: pointer;
        }


        .voice-search-button:hover {
            background: rgba(200, 164, 93, 0.28);
        }


        .voice-search-button.listening {
            background: var(--navy);
            color: white;
        }


        .voice-status {
            margin-top: 10px;

            color: var(--text-soft);

            font-size: 12px;

            min-height: 16px;
        }


        /* RESULTS */

        .results-title {
            color: var(--navy);

            font-size: 18px;

            margin-bottom: 15px;
        }


        .results {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }


        .result-card {
            background: var(--ivory-light);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 20px;
        }


        .document-icon {
            width: 45px;
            height: 45px;

            background:
                rgba(200, 164, 93, 0.16);

            color: var(--gold);

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            margin-bottom: 15px;
        }


        .result-card h3 {
            color: var(--navy);

            font-size: 16px;

            margin-bottom: 7px;
        }


        .category {
            color: var(--text-soft);

            font-size: 12px;

            margin-bottom: 8px;
        }


        .expiry {
            color: var(--text-soft);

            font-size: 12px;
        }


        .empty {
            text-align: center;

            padding: 60px 20px;

            color: var(--text-soft);
        }


        .empty h3 {
            color: var(--navy);

            margin-bottom: 7px;
        }


        /* MOBILE */

        @media (max-width: 900px) {

            .results {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 700px) {

            .sidebar {
                position: static;

                width: 100%;
                height: auto;
            }


            .menu {
                flex-direction: row;

                overflow-x: auto;
            }


            .main {
                margin-left: 0;

                padding: 25px 20px;
            }


            .results {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ✦
            </div>

            <div class="logo-name">
                TrustVault
            </div>

        </div>


        <nav class="menu">

            <a href="dashboard.html">
                <span class="menu-icon">⌂</span>
                Dashboard
            </a>


            <a href="documents.html">
                <span class="menu-icon">▣</span>
                Documents
            </a>


            <a href="add-documents.html">
                <span class="menu-icon">＋</span>
                Add Documents
            </a>


            <a href="search.html" class="active">
                <span class="menu-icon">⌕</span>
                Search
            </a>


            <a href="reminders.html">
                <span class="menu-icon">◷</span>
                Reminders
            </a>


            <a href="ai-assistant.html">
                <span class="menu-icon">✦</span>
                AI Assistant
            </a>


            <a href="profile.html">
                <span class="menu-icon">○</span>
                Profile
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="page-header">

            <h1>
                Search
            </h1>

            <p>
                Quickly find your saved documents.
            </p>

        </div>


        <!-- SEARCH AREA -->

        <div class="search-area">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by document name or category..."
                    oninput="searchDocuments()"
                >


                <button
                    type="button"
                    id="voiceSearchButton"
                    class="voice-search-button"
                    title="Voice Search">

                    🎙

                </button>

            </div>


            <p
                id="voiceStatus"
                class="voice-status">
            </p>

        </div>


        <h2 class="results-title">
            Search Results
        </h2>


        <div
            class="results"
            id="resultsContainer">
        </div>


        <div
            class="empty"
            id="emptyMessage"
            style="display: none;">

            <h3>
                No documents found
            </h3>

            <p>
                Try searching with another name or category.
            </p>

        </div>

</main>


    <!-- JAVASCRIPT -->

    <script>


        /* GET SAVED DOCUMENTS */

        function getDocuments() {

            const saved =
                localStorage.getItem(
                    "trustVaultDocuments"
                );


            if (!saved) {

                return [];

            }


            try {

                return JSON.parse(saved);

            } catch (error) {

                return [];

            }

        }



        /* FORMAT DATE */

        function formatDate(dateString) {

            if (!dateString) {

                return "No expiry date";

            }


            const date =
                new Date(
                    dateString + "T00:00:00"
                );


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }



        /* CATEGORY NAME */

        function categoryName(category) {

            const names = {

                identity: "Identity",

                medical: "Medical Reports",

                education: "Education",

                personal: "Personal",

                other: "Other"

            };


            return (
                names[category] ||
                "Other"
            );

        }



        /* SEARCH DOCUMENTS */

        function searchDocuments() {

            const search =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const documents =
                getDocuments();


            const results =
                documents.filter(
                    function(doc) {

                        const name =
                            (doc.name || "")
                            .toLowerCase();


                        const category =
                            (doc.category || "")
                            .toLowerCase();


                        return (
                            name.includes(search) ||
                            category.includes(search)
                        );

                    }
                );


            const container =
                document.getElementById(
                    "resultsContainer"
                );


            const empty =
                document.getElementById(
                    "emptyMessage"
                );


            container.innerHTML = "";


            if (results.length === 0) {

                empty.style.display =
                    "block";

                return;

            }


            empty.style.display =
                "none";


            results.forEach(
                function(doc) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "result-card";


                    card.innerHTML = `

                        <div class="document-icon">
                            📄
                        </div>

                        <h3>
                            ${escapeHTML(
                                doc.name
                            )}
                        </h3>

                        <p class="category">

                            ${categoryName(
                                doc.category
                            )}

                        </p>

                        <p class="expiry">

                            Expiry Date:
                            ${formatDate(
                                doc.expiryDate
                            )}

                        </p>

                    `;


                    container.appendChild(card);

                }
            );

        }



        /* SECURITY */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text || "";


            return div.innerHTML;

        }



        /* ==========================
           VOICE SEARCH
        ========================== */


        const voiceButton =
            document.getElementById(
                "voiceSearchButton"
            );


        const voiceStatus =
            document.getElementById(
                "voiceStatus"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;



        /* CHECK BROWSER SUPPORT */

        if (!SpeechRecognition) {

            voiceButton.disabled = true;

            voiceStatus.textContent =
                "Voice search is not supported in this browser.";

        }

        else {

            const recognition =
                new SpeechRecognition();


            recognition.lang =
                "en-IN";


            recognition.continuous =
                false;


            recognition.interimResults =
                false;



            /* START LISTENING */

            voiceButton.addEventListener(
                "click",
                function() {

                    try {

                        recognition.start();

                        voiceButton.classList.add(
                            "listening"
                        );

                        voiceStatus.textContent =
                            "Listening... speak now.";

                    }

                    catch (error) {

                        voiceStatus.textContent =
                            "Voice search is already active.";

                    }

                }
            );



            /* SPEECH RESULT */

            recognition.addEventListener(
                "result",
                function(event) {

                    const spokenText =
                        event
                            .results[0][0]
                            .transcript;


                    searchInput.value =
                        spokenText;


                    /* SEARCH AUTOMATICALLY */

                    searchDocuments();


                    voiceStatus.textContent =
                        "Voice search: " +
                        spokenText;

                }
            );



            /* STOP LISTENING */

            recognition.addEventListener(
                "end",
                function() {

                    voiceButton.classList.remove(
                        "listening"
                    );

                }
            );



            /* ERROR */

            recognition.addEventListener(
                "error",
                function(event) {

                    voiceButton.classList.remove(
                        "listening"
                    );


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        voiceStatus.textContent =
                            "Microphone permission was denied.";

                    }

                    else {

                        voiceStatus.textContent =
                            "Unable to hear you. Please try again.";

                    }

                }
            );

        }



        /* LOAD DOCUMENTS WHEN PAGE OPENS */

        searchDocuments();


    </script>


</body>

</html>
